name: Copy Leoday Posts

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon requests

      - name: Run copier
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          # ⬇️⬇️ ВОТ ТУТ МЫ ДОБАВИЛИ ДВЕ СТРОКИ ⬇️⬇️
          GIGACHAT_CLIENT_ID: ${{ secrets.GIGACHAT_CLIENT_ID }}
          GIGACHAT_CLIENT_SECRET: ${{ secrets.GIGACHAT_CLIENT_SECRET }}
          # ⬆️⬆️⬆️ КОНЕЦ ДОБАВЛЕНИЯ ⬆️⬆️⬆️
        run: python main.py

      - name: Save history to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update history [skip ci]"
          git push
