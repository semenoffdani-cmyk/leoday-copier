name: Copy Financial Posts RSS

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Скачиваем сертификат Минцифры с защитой от сбоя
      - name: Download Russian Trusted Root CA
        run: wget https://gu-st.ru/content/Other/doc/russiantrustedca.pem || echo "Сертификат не скачался, но продолжаем работу"

      - name: Run copier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          GIGACHAT_CLIENT_ID: ${{ secrets.GIGACHAT_CLIENT_ID }}
          GIGACHAT_CLIENT_SECRET: ${{ secrets.GIGACHAT_CLIENT_SECRET }}
        run: python main.py

      - name: Save history and embeddings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -f history.json ]; then git add history.json; fi
          if [ -f embeddings.json ]; then git add embeddings.json; fi
          
          if ! git diff --staged --quiet; then
            git commit -m "Update history and embeddings [skip ci]"
            git push
          else
            echo "Нет изменений для сохранения."
          fi
