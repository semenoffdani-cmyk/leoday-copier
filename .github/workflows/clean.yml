name: Clean Duplicates

on:
  workflow_dispatch: # Запускается только вручную по кнопке

permissions:
  contents: write # <-- ДОБАВЛЕНО: разрешение на сохранение файлов

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install telethon
        
      - name: Run cleaner
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        run: python clean_duplicates.py

      # <-- ДОБАВЛЕНО: шаг сохранения истории обратно в репозиторий
      - name: Save history to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Clean duplicates [skip ci]"
          git push
